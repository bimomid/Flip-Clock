name: Bug 报告
description: 报告一个可以复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同 issue。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简明描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows
        - Linux
        - Android
        - 浏览器（pnpm dev）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 见 Releases 页面或安装包文件名
      placeholder: 1.0.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 截图、控制台报错或崩溃日志
      render: shell
    validations:
      required: false
