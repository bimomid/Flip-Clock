name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认没有重复的 issue。想法越具体越好。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么不便？例如「专注计时结束时无法自定义…」
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 翻页时钟
        - 专注计时
        - 秒表
        - 任务便签
        - 图标坞 / 主题
        - 国际化
        - 构建 / 发布
        - 其他
    validations:
      required: true
