<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="39 30 432 432">
  <title>FlipClock — Unified Interwoven Satin Ribbon</title>
  <desc>One continuous gold ribbon interwoven with a teal ribbon, with the original central blended channel and soft satin highlights.</desc>
  <defs>
    <!-- One continuous gold surface: the former top and fold colors now share one gradient. -->
    <linearGradient id="goldBody" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#FFD85A"/>
      <stop offset=".125" stop-color="#FFE575"/>
      <stop offset=".25" stop-color="#FFDF60"/>
      <stop offset=".375" stop-color="#FFD04A"/>
      <stop offset=".5" stop-color="#FFC13B"/>
      <stop offset=".625" stop-color="#F0BE57"/>
      <stop offset=".75" stop-color="#D5C87A"/>
      <stop offset=".875" stop-color="#A8D3A0"/>
      <stop offset="1" stop-color="#5CCFBA"/>
    </linearGradient>
    <linearGradient id="tealRear" x1="88%" y1="5%" x2="15%" y2="100%">
      <stop offset="0" stop-color="#75F2E1"/>
      <stop offset=".21" stop-color="#36D4C7"/>
      <stop offset=".43" stop-color="#0D98A0"/>
      <stop offset=".70" stop-color="#075969"/>
      <stop offset="1" stop-color="#063B48"/>
    </linearGradient>
    <linearGradient id="tealFront" x1="12%" y1="0%" x2="86%" y2="100%">
      <stop offset="0" stop-color="#83FBEA"/>
      <stop offset=".20" stop-color="#4BE4D4"/>
      <stop offset=".48" stop-color="#25D3C7"/>
      <stop offset=".75" stop-color="#13BDBA"/>
      <stop offset="1" stop-color="#087F92"/>
    </linearGradient>
    <!-- Keep the original center blend intact to preserve the interwoven transition. -->
    <linearGradient id="channel" gradientUnits="userSpaceOnUse" x1="398" y1="207" x2="205" y2="359">
      <stop offset="0" stop-color="#0A5967"/>
      <stop offset=".18" stop-color="#176B70"/>
      <stop offset=".38" stop-color="#3E8876"/>
      <stop offset=".57" stop-color="#7EB67D"/>
      <stop offset=".78" stop-color="#BFD47D"/>
      <stop offset="1" stop-color="#F0C34B"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="20%" cy="16%" r="86%">
      <stop stop-color="#FFFCE3" stop-opacity=".17"/>
      <stop offset=".55" stop-color="#FFF7C6" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="63%" cy="24%" r="86%">
      <stop stop-color="#DFFFF9" stop-opacity=".17"/>
      <stop offset=".54" stop-color="#9BFFF1" stop-opacity=".045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#FFF9D3" stop-opacity=".67"/>
      <stop offset="1" stop-color="#FFF9D3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tealRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#D8FFF8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#D8FFF8" stop-opacity="0"/>
    </linearGradient>

    <!-- A single outer contour merges the former goldTop and goldFold surfaces. -->
    <path id="goldRibbonShape" d="
      M 109 191
      C 109 166, 125 145, 150 132
      L 282 64
      C 294 57, 306 60, 312 69
      C 316 75, 317 83, 317 92
      L 317 139
      C 317 168, 305 193, 282 212
      C 259 231, 226 249, 195 267
      C 169 283, 154 299, 154 313
      C 154 327, 175 341, 199 355
      C 211 362, 222 371, 231 379
      C 213 365, 192 351, 175 339
      C 151 322, 122 304, 111 279
      C 109 276, 109 271, 109 266
      L 109 191 Z"/>
  </defs>

  <!-- Rear teal ribbon. -->
  <path fill="url(#tealRear)" d="
    M 317 139
    C 338 136, 361 151, 382 170
    C 400 186, 406 201, 398 217
    C 390 233, 369 246, 344 260
    L 269 301
    C 246 315, 225 334, 215 354
    C 210 365, 208 378, 208 391
    C 205 371, 207 353, 214 339
    C 224 319, 244 304, 269 290
    L 355 243
    C 379 230, 393 216, 394 203
    C 395 188, 377 169, 356 156
    C 340 146, 327 140, 317 139 Z"/>

  <!-- Original central gradient channel retained. -->
  <path fill="url(#channel)" d="
    M 317 139
    C 317 168, 305 193, 282 212
    C 259 231, 226 249, 195 267
    C 169 283, 154 299, 154 313
    C 154 327, 175 341, 199 355
    C 210 363, 221 371, 231 379
    C 222 360, 218 345, 226 331
    C 240 312, 265 297, 294 281
    C 312 271, 329 262, 345 252
    C 373 237, 391 222, 398 207
    C 400 202, 399 197, 396 191
    C 389 176, 370 161, 352 151
    C 338 143, 326 139, 317 139 Z"/>

  <!-- Unified gold ribbon: one silhouette, one continuous body gradient. -->
  <use href="#goldRibbonShape" fill="url(#goldBody)"/>
  <use href="#goldRibbonShape" fill="url(#goldGlow)"/>

  <!-- Soft satin rim highlight, matching the treatment of the teal ribbon. -->
  <path d="M 112 190 C 114 166, 130 146, 153 134 L 281 68"
        fill="none" stroke="url(#goldRim)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Front teal ribbon. -->
  <path fill="url(#tealFront)" d="
    M 206 361
    C 207 344, 219 327, 242 312
    C 274 292, 316 270, 352 250
    C 376 237, 392 222, 398 207
    C 400 212, 400 217, 400 223
    L 400 300
    C 400 323, 388 339, 369 351
    L 233 429
    C 222 435, 211 432, 207 423
    C 204 418, 204 412, 204 405
    L 204 383
    C 204 373, 204.5 366, 206 361 Z"/>
  <path fill="url(#tealGlow)" d="
    M 206 361
    C 207 344, 219 327, 242 312
    C 274 292, 316 270, 352 250
    C 376 237, 392 222, 398 207
    C 400 212, 400 217, 400 223
    L 400 300
    C 400 323, 388 339, 369 351
    L 233 429
    C 222 435, 211 432, 207 423
    C 204 418, 204 412, 204 405
    L 204 383
    C 204 373, 204.5 366, 206 361 Z"/>

  <!-- Fine highlights describe the woven turn without adding a seam to the gold. -->
  <path d="M 332 147 C 349 151, 368 165, 382 180 C 391 190, 394 199, 390 208"
        fill="none" stroke="url(#tealRim)" stroke-width="1.1" stroke-linecap="round" opacity=".62"/>
  <path d="M 397 219 C 390 232, 373 244, 352 256 L 270 300 C 243 315, 223 332, 212 351"
        fill="none" stroke="url(#tealRim)" stroke-width=".9" stroke-linecap="round" opacity=".24"/>
</svg>
