[package]
name = "flip-clock"
version = "1.0.0"
description = "A versatile desktop flip clock built with Vue 3 and Tauri"
edition = "2021"

[lib]
name = "flip_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

