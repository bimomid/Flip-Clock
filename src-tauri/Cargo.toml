[package]
name = "flip-clock"
version = "1.0.0"
description = "A versatile desktop flip clock built with Vue 3 and Tauri"
edition = "2021"

[lib]
name = "flip_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

